{% extends 'base.html' %}

{% block title %}Password Changed — Daania{% endblock %}

{% block content %}
<div class="mx-auto flex min-h-[calc(100vh-5rem)] max-w-md flex-col justify-center px-4 py-16 sm:px-6">
  <div class="rounded-3xl border border-border/70 bg-card shadow-soft p-8 sm:p-10 text-center">
    <div class="mx-auto mb-4 grid h-14 w-14 place-items-center rounded-full bg-[#eef2ee] text-[#486551]">
      <i data-lucide="shield-check" class="h-7 w-7"></i>
    </div>
    <h1 class="font-display text-2xl font-bold tracking-tight">Password changed</h1>
    <p class="mt-3 text-sm leading-relaxed text-muted-foreground">
      Your password has been successfully updated.
    </p>
    <a href="{% url 'profile' %}"
      class="mt-6 inline-flex h-11 w-full items-center justify-center rounded-full text-sm font-semibold text-white transition-all hover:opacity-90"
      style="background-color:#486551;">
      Return to Profile
    </a>
  </div>
</div>
{% endblock %}
