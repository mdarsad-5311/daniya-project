{% extends 'base.html' %}

{% block title %}Page Not Found - Daania{% endblock %}

{% block content %}
<div class="flex min-h-[70vh] items-center justify-center bg-background px-4">
  <div class="max-w-md text-center">
    <h1 class="font-display text-7xl font-bold text-foreground">404</h1>
    <h2 class="mt-4 font-display text-2xl font-semibold text-foreground">Page not found</h2>
    <p class="mt-2 text-sm text-muted-foreground">
      The page you're looking for doesn't exist or has been moved.
    </p>
    <div class="mt-6">
      <a
        href="{% url 'home' %}"
        class="inline-flex h-10 items-center justify-center rounded-full bg-primary px-8 text-sm font-medium text-primary-foreground transition-colors hover:bg-primary/90"
      >
        Go home
      </a>
    </div>
  </div>
</div>
{% endblock %}
