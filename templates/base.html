{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#486551">
    <meta name="color-scheme" content="light">
    <title>{% block title %}Daania{% endblock %}</title>
    
    <!-- Compiled Tailwind CSS (Production AOT) -->
    <link href="{% static 'css/dist.css' %}" rel="stylesheet">


    <!-- Google Fonts (Updated to Lovable Style) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Alpine.js Plugins -->
    <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
    <!-- Alpine.js Core (Replacing React useState) -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    
    <!-- HTMX for seamless interactions -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="font-sans antialiased text-foreground bg-background min-h-screen" x-data="{ searchOpen: false, menuOpen: false, wishOpen: false, cartOpen: false, scrolled: false }" @scroll.window="scrolled = (window.pageYOffset > 12)">

    {% include 'navbar.html' %}
    {% include 'cart/cart_drawer.html' %}

    <main>
        {% block content %}{% endblock %}
    </main>

    {% include 'footer.html' %}

    <!-- Initialize Icons -->
    <script>
        lucide.createIcons();
        document.body.addEventListener('htmx:afterSwap', function() {
            if (window.lucide) {
                lucide.createIcons();
            }
        });
    </script>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
