{% extends 'base.html' %}

{% block title %}Payment unavailable — Daania{% endblock %}

{% block content %}
<div class="mx-auto max-w-2xl px-4 py-20 text-center sm:px-6">
  <i data-lucide="credit-card" class="mx-auto h-12 w-12 text-muted-foreground"></i>
  <h1 class="mt-5 font-display text-4xl">Payment could not start</h1>
  <p class="mx-auto mt-3 max-w-md text-sm text-muted-foreground">{{ message }}</p>
  <a href="{% url 'cart' %}" class="mt-8 inline-flex h-10 items-center justify-center rounded-full bg-primary px-8 text-sm font-medium text-primary-foreground">Return to your bag</a>
</div>
{% endblock %}
